<svg xmlns="http://www.w3.org/2000/svg" width="920" height="700" viewBox="0 0 920 700" font-family="'Segoe UI', Arial, Helvetica, sans-serif">
  <title>Sylvac Bluetooth developer paths</title>
  <desc>Top to bottom. Platform, then software, then hardware, then Bluetooth, then instruments. Path 1, recommended: Windows or Linux, Sylvac libraries (C# / .NET 10 on Windows; Rust library called from Python on Windows and Linux; folder libraries/), to the Bluetooth 5 SMART dongle (BL654, BT5, ref. 981-7102 / 981-7103, up to 16 instruments) or the Bluetooth 4 dongle (BLED112, BT4, ref. 981-7100, up to 8 instruments). Path 2: Windows, Bluegiga BGAPI SDK, low level, BLED112 (BT4) only, folder bled112-bt4-sdk/. Path 3: Android, iOS, macOS, Linux or Windows, native Bluetooth API or cross-platform framework, folders gatt-profiles/ and docs/, to the built-in Bluetooth of the device. All paths reach the instruments through the Sylvac custom Bluetooth GATT profile (SDS, SMS).</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#222"/>
    </marker>
    <g id="wave">
      <circle r="15" fill="#fff" stroke="#444" stroke-width="1.5"/>
      <circle cx="-5" cy="0" r="2.2" fill="#444"/>
      <path d="M-1,-5 A6,6 0 0 1 -1,5" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
      <path d="M3,-8.5 A10,10 0 0 1 3,8.5" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="920" height="700" rx="16" fill="#ffffff"/>

  <!-- Row labels -->
  <g font-size="14" fill="#444" text-anchor="middle">
    <rect x="16" y="30" width="112" height="40" rx="4" fill="#f7f7f7" stroke="#d5d5d5"/>
    <text x="72" y="55">Platform</text>
    <rect x="16" y="157" width="112" height="40" rx="4" fill="#f7f7f7" stroke="#d5d5d5"/>
    <text x="72" y="182">Libraries / API</text>
    <rect x="16" y="320" width="112" height="40" rx="4" fill="#f7f7f7" stroke="#d5d5d5"/>
    <text x="72" y="345">Hardware</text>
    <rect x="16" y="451" width="112" height="40" rx="4" fill="#f7f7f7" stroke="#d5d5d5"/>
    <text x="72" y="476">Bluetooth</text>
    <rect x="16" y="575" width="112" height="40" rx="4" fill="#f7f7f7" stroke="#d5d5d5"/>
    <text x="72" y="600">Instruments</text>
  </g>

  <!-- Platforms -->
  <g fill="#fff" stroke="#7a7a7a" stroke-width="2">
    <rect x="150" y="24" width="350" height="52" rx="10"/>
    <rect x="520" y="24" width="170" height="52" rx="10"/>
    <rect x="710" y="24" width="190" height="52" rx="10"/>
  </g>
  <g font-size="14" font-weight="700" fill="#333" text-anchor="middle">
    <text x="325" y="55">Windows · Linux</text>
    <text x="605" y="55">Windows</text>
    <text x="805" y="46">Android · iOS · macOS</text>
    <text x="805" y="65">Linux · Windows</text>
  </g>

  <!-- Platform to software arrows -->
  <g stroke="#222" stroke-width="1.5" marker-end="url(#arrow)">
    <line x1="325" y1="76" x2="325" y2="114"/>
    <line x1="605" y1="76" x2="605" y2="114"/>
    <line x1="805" y1="76" x2="805" y2="114"/>
  </g>

  <!-- Software -->
  <g fill="#ffd966" stroke="#ead187" stroke-width="2">
    <rect x="150" y="118" width="350" height="118" rx="12"/>
    <rect x="520" y="118" width="170" height="118" rx="12"/>
    <rect x="710" y="118" width="190" height="118" rx="12"/>
  </g>
  <!-- Sylvac libraries -->
  <text x="170" y="147" font-size="16" font-weight="700" fill="#222">Sylvac libraries</text>
  <rect x="384" y="131" width="100" height="21" rx="10.5" fill="#fff" stroke="#ad9445" stroke-width="1.5"/>
  <text x="434" y="146" font-size="11.5" font-weight="700" fill="#7d6a2c" text-anchor="middle">Recommended</text>
  <g font-size="13" fill="#222">
    <text x="170" y="176" font-weight="700">C# / .NET 10</text>
    <text x="370" y="176">Windows</text>
    <text x="170" y="199" font-weight="700">Rust, called from Python</text>
    <text x="370" y="199">Windows, Linux</text>
  </g>
  <text x="170" y="224" font-size="12" fill="#6b5a1e" font-family="Consolas, 'Courier New', monospace">libraries/</text>
  <!-- BGAPI SDK -->
  <g text-anchor="middle" fill="#222">
    <text x="605" y="147" font-size="16" font-weight="700">BGAPI SDK</text>
    <text x="605" y="176" font-size="13">Bluegiga, low level</text>
    <text x="605" y="199" font-size="13" font-weight="700">BLED112 (BT4) only</text>
    <text x="605" y="224" font-size="12" fill="#6b5a1e" font-family="Consolas, 'Courier New', monospace">bled112-bt4-sdk/</text>
  </g>
  <!-- Native API -->
  <g text-anchor="middle" fill="#222">
    <text x="805" y="147" font-size="15" font-weight="700">Native Bluetooth API</text>
    <text x="805" y="176" font-size="13">or cross-platform</text>
    <text x="805" y="195" font-size="13">framework</text>
    <text x="805" y="224" font-size="12" fill="#6b5a1e" font-family="Consolas, 'Courier New', monospace">gatt-profiles/ · docs/</text>
  </g>

  <!-- Software to hardware arrows -->
  <g stroke="#222" stroke-width="1.5" marker-end="url(#arrow)" fill="none">
    <line x1="250" y1="236" x2="250" y2="286"/>
    <line x1="450" y1="236" x2="450" y2="286"/>
    <line x1="580" y1="236" x2="552" y2="286"/>
    <line x1="805" y1="236" x2="805" y2="286"/>
  </g>

  <!-- Hardware -->
  <g fill="#fff" stroke="#ad9445" stroke-width="3">
    <rect x="150" y="290" width="200" height="100" rx="10"/>
    <rect x="370" y="290" width="200" height="100" rx="10"/>
    <rect x="710" y="290" width="190" height="100" rx="10"/>
  </g>
  <g text-anchor="middle">
    <text x="250" y="315" font-size="13.5" font-weight="700" fill="#222">Bluetooth 5 SMART dongle</text>
    <text x="250" y="335" font-size="13" fill="#333">BL654 · BT5</text>
    <text x="250" y="356" font-size="13.5" font-weight="700" fill="#7d6a2c">981-7102 / 981-7103</text>
    <text x="250" y="377" font-size="12" fill="#555">up to 16 instruments</text>

    <text x="470" y="315" font-size="13.5" font-weight="700" fill="#222">Bluetooth 4 dongle</text>
    <text x="470" y="335" font-size="13" fill="#333">BLED112 · BT4</text>
    <text x="470" y="356" font-size="13.5" font-weight="700" fill="#7d6a2c">981-7100</text>
    <text x="470" y="377" font-size="12" fill="#555">up to 8 instruments</text>

    <text x="805" y="315" font-size="13.5" font-weight="700" fill="#222">Built-in Bluetooth</text>
    <text x="805" y="335" font-size="13" fill="#333">phone, tablet, Mac, PC</text>
    <text x="805" y="356" font-size="13" fill="#333">Bluetooth 4.0 to 5.x</text>
  </g>

  <!-- Radio links -->
  <g stroke="#7a7a7a" stroke-width="1.5" stroke-dasharray="3 3">
    <line x1="250" y1="390" x2="250" y2="448"/>
    <line x1="470" y1="390" x2="470" y2="448"/>
    <line x1="805" y1="390" x2="805" y2="448"/>
    <line x1="525" y1="494" x2="525" y2="548"/>
  </g>
  <use href="#wave" x="250" y="419"/>
  <use href="#wave" x="470" y="419"/>
  <use href="#wave" x="805" y="419"/>
  <use href="#wave" x="525" y="521"/>

  <!-- Bluetooth band -->
  <rect x="146" y="444" width="758" height="54" rx="15" fill="none" stroke="#0082fc" stroke-width="2" stroke-dasharray="7 5"/>
  <rect x="150" y="448" width="750" height="46" rx="12" fill="#0082fc"/>
  <text x="525" y="477" font-size="16" font-weight="700" fill="#fff" text-anchor="middle">Sylvac custom Bluetooth GATT profile  ·  SDS, SMS</text>

  <!-- Instrument: caliper -->
  <g fill="#4c565c">
    <rect x="360" y="572" width="340" height="13" rx="2"/>
    <path d="M360,572 h28 v52 l-9,30 h-5 l-14,-44 z"/>
    <path d="M364,572 v-16 l7,-7 h5 v23 z"/>
    <rect x="410" y="560" width="150" height="38" rx="7"/>
    <path d="M410,598 h28 v26 l-9,30 h-5 l-14,-44 z"/>
    <path d="M414,560 v-4 l7,-7 h5 v11 z"/>
    <rect x="700" y="575" width="40" height="5" rx="1"/>
  </g>
  <rect x="424" y="567" width="82" height="24" rx="3" fill="#dde6ea"/>
  <text x="465" y="584" font-size="13" font-weight="700" fill="#222" text-anchor="middle" font-family="Consolas, 'Courier New', monospace">12.345</text>
  <circle cx="535" cy="579" r="7" fill="#ffd966"/>
  <text x="620" y="625" font-size="14" font-weight="700" fill="#222">Sylvac instruments</text>
  <text x="620" y="644" font-size="12" fill="#555">Bluetooth name starting with SY</text>
</svg>
