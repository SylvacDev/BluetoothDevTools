# Open Rust wrapper of the Sylvac BLE SDK. A workspace of its own: it depends on nothing but the
# prebuilt C library (sylvac_ble.dll / libsylvac_ble.so), found through SYLVAC_BLE_SDK_DIR.
[workspace]
resolver = "2"
members = ["sylvac-ble-sys", "sylvac-ble"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
